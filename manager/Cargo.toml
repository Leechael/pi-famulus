[package]
name = "pi-famulus"
version = "0.1.2"
edition = "2021"
rust-version = "1.91"
description = "Cross-platform process management daemon for pi-famulus"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
usage = { package = "usage-rs", version = "6", features = ["completions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = { version = "2", features = ["tokio"] }
fd-lock = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
# Test-only: the daemon's own timers (idle grace, SIGKILL escalation,
# re-adopt / leftover-group polls) can run on a manual clock, advanced with
# the `clock_advance` debug request, when the daemon starts with
# PI_FAMULUS_TEST_CLOCK=manual. Never enable in release builds.
test-clock = []

# Thin LTO over the default codegen units: an incremental release build
# (the install step in docs/testing-guide.md) takes ~10 s instead of ~30 s
# with fat LTO on one unit, for a ~1 MB larger binary. The daemon is not
# CPU-bound, so the extra optimisation bought nothing measurable.
[profile.release]
lto = "thin"
strip = true
