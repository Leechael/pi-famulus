# Code-ablation manifest for pi-famulus.
#
# Each entry removes (or neuters) one load-bearing mechanism with a literal
# find/replace on a *temporary copy* of manager/, then runs the listed tests.
# `expect = "red"`: every listed test must FAIL (or hang past the timeout)
# with the mechanism gone; otherwise the tests do not actually guard it.
# `expect = "green"`: the ablation is expected to be undetectable by the
# black-box suite (redundant / defensive code); listed tests must still pass.
# That is a finding, not a goal: see the `note`.
#
# Runner: manager/scripts/ablate.sh (see manager/TESTING.md). The `find`
# string must occur exactly once in `file`; a miss means the manifest went
# stale against src and the runner reports it instead of guessing.
#
# Test ids are "<integration test target>::<test fn>".

[[ablation]]
id = "idle-grace-5s"
mechanism = "zero active connections must persist 5s before graceful shutdown (§3.2)"
file = "src/daemon.rs"
find = "const IDLE_SHUTDOWN: Duration = Duration::from_secs(5);"
replace = "const IDLE_SHUTDOWN: Duration = Duration::from_millis(50);"
tests = [
  "lifecycle_adversarial::d5_client_crash_grace_then_kill_everything_and_clean_files",
  "lifecycle_adversarial::d6_connection_inside_grace_cancels_shutdown",
  "lifecycle_adversarial::d6b_brief_reconnect_restarts_grace",
  "protocol::t09_zero_connections_shutdown_kills_tasks",
]
expect = "red"

