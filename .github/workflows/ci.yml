name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger from any branch, mirroring the roamresearch-cli pattern:
  # pick a ref (branch, tag, or SHA) and run the full CI suite against it.
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and test (empty uses the selected branch)
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and test
        type: string
        default: ''
      version:
        description: If set, rewrite release metadata to this version before packing
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && github.event_name != 'workflow_dispatch' }}

jobs:
  native-packages:
    uses: ./.github/workflows/native-packages.yml
    with:
      ref: ${{ inputs.ref || '' }}
      version: ${{ inputs.version || '' }}

  # The manager's Windows suites run in the native-packages matrix (win32-*).
  # Pi-version compatibility stays on Ubuntu; Windows gets the locked-suite unit tests.
  extension-compat:
    name: extension (pi ${{ matrix.pi-version }})
    strategy:
      fail-fast: false
      matrix:
        pi-version: ['1.0.0', '1.0.4', latest]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # First-party natives use local lock links before registry bootstrap.
      # Do not omit all optionals: TypeScript and Rollup need native bindings.
      - run: npm ci
      - run: npx tsc --noEmit
      # Run the full suite with the locked local native package links once.
      - run: npx vitest run
        if: matrix.pi-version == '1.0.0'
      # Test the minimum, a known later release, and the current registry release.
      # Keep the development pin and lockfile untouched by matrix installs.
      - name: Install and verify selected pi version
        run: |
          # Resolve latest once, then install that exact release and assert it.
          resolved=$(npm view "@earendil-works/pi-coding-agent@$PI_VERSION" version)
          npm install --no-save --package-lock=false "@earendil-works/pi-coding-agent@$resolved"
          PI_EXPECTED_VERSION="$resolved" node --input-type=commonjs -e '
            const actual = require("./node_modules/@earendil-works/pi-coding-agent/package.json").version;
            const expected = process.env.PI_EXPECTED_VERSION;
            if (actual !== expected) throw new Error(`Expected pi ${expected}, installed ${actual}`);
            console.log(`Verified pi ${actual}`);
          '
          git diff --exit-code -- package.json package-lock.json
        env:
          PI_VERSION: ${{ matrix.pi-version }}
      - run: npx tsc --noEmit
      # Real-SDK coverage guards inherited config and isolated child resources.
      # Limit overrides to these tests: npm install can resolve registry natives
      # instead of local lock links, changing unrelated binary-search fixtures.
      - run: >-
          npx vitest run
          tests/unit/impl-child-resource-isolation.test.ts
          tests/unit/impl-child-tools.test.ts
          tests/unit/impl-child-guidelines.test.ts
          tests/unit/impl-subagent-lifecycle.test.ts
          tests/unit/impl-steering-drain.test.ts
          tests/unit/impl-model-spec.test.ts
          tests/unit/impl-eval-fixes.test.ts
          tests/integration/behavior-guidelines.test.ts

  extension-windows:
    name: extension (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # First-party natives use local lock links before registry bootstrap.
      # Do not omit all optionals: TypeScript and Rollup need native bindings.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # Preserve the historical required check name while the compatibility matrix
  # reports its individual versioned checks.
  extension:
    needs: [extension-compat, extension-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the compatibility matrix and Windows suite to pass
        run: |
          test "${{ needs.extension-compat.result }}" = success
          test "${{ needs.extension-windows.result }}" = success

  # Real pi + real pi-famulus + the extension, driven by the faux model.
  # No model credentials, no network: pi runs with --offline.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      # macos-latest and ubuntu-latest intentionally track current hosted images
      # for real-world compatibility coverage; other Ubuntu jobs are pinned.
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PI_FAMULUS_MANAGER_PATH: ${{ github.workspace }}/manager/target/release/pi-famulus${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
      # pi's own entry point on Windows: node_modules/.bin/pi is a .cmd shim there.
      PI_BIN: ${{ github.workspace }}/eval/node_modules/${{ startsWith(matrix.os, 'windows') && '@earendil-works/pi-coding-agent/dist/bundle/cli.js' || '.bin/pi' }}
      # Keep every sandbox (eval-* under the temp dir) so a failure can be uploaded.
      PI_FAMULUS_EVAL_KEEP: "1"
      # real-manager integration uses its own home, not an eval sandbox.
      PI_FAMULUS_TEST_ARTIFACTS: ${{ github.workspace }}/pi-famulus-test-artifacts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            eval/package-lock.json
      - run: cargo build --release
        working-directory: manager
      # Require the exact release artifact before running real integration;
      # a missing or misnamed binary must not pass as green.
      - run: test -x "$PI_FAMULUS_MANAGER_PATH"
      - run: npm ci
        working-directory: extension
      - run: npm ci
        working-directory: eval
      - run: npx vitest run tests/integration/real-manager.test.ts tests/integration/contract-startup-lock-gap.test.ts
        working-directory: extension
        env:
          PI_FAMULUS_INTEG: "1"
      - run: npm run typecheck
        working-directory: eval
      # Eval-internal unit and grader tests drive /bin/sh fixtures; the
      # product scenarios (integration + faux e2e) run on every OS.
      - run: npm run test:unit
        working-directory: eval
        if: runner.os != 'Windows'
      - run: npm run test:graders
        working-directory: eval
        if: runner.os != 'Windows'
      - run: npm run test:e2e
        working-directory: eval
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-sandboxes-${{ matrix.os }}
          path: |
            pi-famulus-test-artifacts/
            /tmp/eval-*/h/manager.log
            /tmp/eval-*/h/events.jsonl
            /tmp/eval-*/h/config.json
            /tmp/eval-*/faux-trace.jsonl
            ~/AppData/Local/Temp/eval-*/h/manager.log
            ~/AppData/Local/Temp/eval-*/h/events.jsonl
            ~/AppData/Local/Temp/eval-*/faux-trace.jsonl
          if-no-files-found: ignore
