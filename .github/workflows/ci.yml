name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger from any branch, mirroring the roamresearch-cli pattern:
  # pick a ref (branch, tag, or SHA) and run the full CI suite against it.
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and test (empty uses the selected branch)
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and test
        type: string
        default: ''
      version:
        description: If set, rewrite release metadata to this version before packing
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

# Only PR updates share a group. A unique group for every other run also
# prevents GitHub's single pending slot from replacing an older main commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/main' }}

jobs:
  # Package validation always runs for code changes; the expensive manager
  # suites only when the manager changed, release packaging only when a
  # packaged component (manager or extension) changed.
  native-packages:
    needs: pi-matrix
    if: needs.pi-matrix.outputs.code == 'true'
    uses: ./.github/workflows/native-packages.yml
    with:
      ref: ${{ inputs.ref || '' }}
      version: ${{ inputs.version || '' }}
      manager-tests: ${{ needs.pi-matrix.outputs.rust == 'true' }}
      all-architectures: ${{ github.event_name != 'pull_request' }}
      packages: ${{ needs.pi-matrix.outputs.rust == 'true' || needs.pi-matrix.outputs.extension == 'true' }}

  # Lint gate: clippy warnings fail the build. Each OS compiles its own cfg
  # branches (Unix handover, macOS proc_pidinfo, Windows job objects), so a
  # Linux-only run would miss most of the platform code.
  clippy:
    needs: pi-matrix
    if: needs.pi-matrix.outputs.rust == 'true'
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager
          key: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --release -- -D warnings

  # Matrix and pins live in .github/pi-compat.json, shared with upstream-drift.yml.
  pi-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      code: ${{ steps.scope.outputs.code }}
      rust: ${{ steps.scope.outputs.rust }}
      extension: ${{ steps.scope.outputs.extension }}
      eval: ${{ steps.scope.outputs.eval }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: ./.github/actions/ci-scope
        id: scope
        with:
          force: ${{ inputs.ref != '' || inputs.version != '' }}
      - id: read
        run: echo "matrix=$(jq -c . .github/pi-compat.json)" >> "$GITHUB_OUTPUT"

  # The manager's Windows suites run in the native-packages matrix (win32-*).
  # Pi-version compatibility stays on Ubuntu; Windows gets the locked-suite unit tests.
  # Pins keep this job about pi-famulus; upstream-drift.yml checks unpinned installs.
  extension-compat:
    name: extension (pi ${{ matrix.pi-version }})
    needs: pi-matrix
    if: needs.pi-matrix.outputs.extension == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pi-matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # First-party natives use local lock links before registry bootstrap.
      # Do not omit all optionals: TypeScript and Rollup need native bindings.
      # The locked source tree is identical in every compatibility lane. Check
      # it once here; each selected pi version is still typechecked below.
      - run: npm ci
      - run: npx tsc --noEmit
        if: matrix.pi-version == '1.0.0'
      # Run the full suite with the locked local native package links once.
      - run: npx vitest run
        if: matrix.pi-version == '1.0.0'
      # Test the minimum, a known later release, and the current registry release.
      - name: Install and verify selected pi version
        # PI_PINS is unquoted on purpose: empty adds nothing, otherwise one spec per word.
        run: ../scripts/install-pi-compat.sh "$PI_VERSION" $PI_PINS
        env:
          PI_VERSION: ${{ matrix.pi-version }}
          PI_PINS: ${{ matrix.pi-pins }}
      - run: npx tsc --noEmit
      # Real-SDK coverage guards inherited config and isolated child resources.
      # test:compat is a fixed file list: npm install can resolve registry natives
      # instead of local lock links, changing unrelated binary-search fixtures.
      - run: npm run test:compat

  extension-windows:
    needs: pi-matrix
    if: needs.pi-matrix.outputs.extension == 'true'
    name: extension (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # First-party natives use local lock links before registry bootstrap.
      # Do not omit all optionals: TypeScript and Rollup need native bindings.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # Keep the historical required check name, now covering the entire pipeline.
  # Require this stable aggregate, not conditional matrix names: docs-only
  # matrix jobs are skipped before their individual check names are expanded.
  extension:
    needs: [pi-matrix, native-packages, clippy, extension-compat, extension-windows, e2e]
    # Unlike always(), this does not keep superseded runs alive just to report
    # a failed aggregate. Ordinary upstream failures still reach this gate.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI family the scope selected, and only those
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const results = JSON.parse(process.env.RESULTS);
          const scope = results['pi-matrix'];
          assert.equal(scope.result, 'success', 'scope classification must succeed');
          const decision = name => {
            const value = scope.outputs?.[name];
            assert.ok(['true', 'false'].includes(value), `scope decision ${name} must be explicit`);
            return value === 'true';
          };
          const code = decision('code');
          const rust = decision('rust');
          const extension = decision('extension');
          const evalHarness = decision('eval');
          assert.ok(code || !(rust || extension || evalHarness), 'docs-only scope cannot select a component');
          const wanted = {
            'native-packages': code,
            clippy: rust,
            'extension-compat': extension,
            'extension-windows': extension,
            e2e: rust || extension || evalHarness,
          };
          for (const [name, run] of Object.entries(wanted)) {
            const expected = run ? 'success' : 'skipped';
            assert.equal(results[name]?.result, expected, `${name} must be ${expected}`);
          }
          NODE

  # Real pi + real pi-famulus + the extension, driven by the faux model.
  # No model credentials, no network: pi runs with --offline.
  # Drives the real manager, the extension and the eval harness together.
  e2e:
    needs: pi-matrix
    if: needs.pi-matrix.outputs.rust == 'true' || needs.pi-matrix.outputs.extension == 'true' || needs.pi-matrix.outputs.eval == 'true'
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      # macos-latest and ubuntu-latest intentionally track current hosted images
      # for real-world compatibility coverage; other Ubuntu jobs are pinned.
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        # One architecture per OS on PRs; main pushes and releases run all.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-24.04-arm"}]' || '[]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PI_FAMULUS_MANAGER_PATH: ${{ github.workspace }}/manager/target/release/pi-famulus${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
      # pi's own entry point on Windows: node_modules/.bin/pi is a .cmd shim there.
      PI_BIN: ${{ github.workspace }}/eval/node_modules/${{ startsWith(matrix.os, 'windows') && '@earendil-works/pi-coding-agent/dist/bundle/cli.js' || '.bin/pi' }}
      # Keep every sandbox (eval-* under the temp dir) so a failure can be uploaded.
      PI_FAMULUS_EVAL_KEEP: "1"
      # real-manager integration uses its own home, not an eval sandbox.
      PI_FAMULUS_TEST_ARTIFACTS: ${{ github.workspace }}/pi-famulus-test-artifacts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            eval/package-lock.json
      - run: cargo build --release
        working-directory: manager
      # Require the exact release artifact before running real integration;
      # a missing or misnamed binary must not pass as green.
      - run: test -x "$PI_FAMULUS_MANAGER_PATH"
      - run: npm ci
        working-directory: extension
      - run: npm ci
        working-directory: eval
      - run: npx vitest run tests/integration/real-manager.test.ts tests/integration/contract-startup-lock-gap.test.ts
        working-directory: extension
        env:
          PI_FAMULUS_INTEG: "1"
      # This pure TypeScript check has the same inputs on every host. Runtime
      # integration, Unix unit tests and graders retain their OS coverage.
      - run: npm run typecheck
        working-directory: eval
        if: matrix.os == 'ubuntu-latest'
      # Eval-internal unit and grader tests drive /bin/sh fixtures; the
      # product scenarios (integration + faux e2e) run on every OS.
      - run: npm run test:unit
        working-directory: eval
        if: runner.os != 'Windows'
      - run: npm run test:graders
        working-directory: eval
        if: runner.os != 'Windows'
      - run: npm run test:e2e
        working-directory: eval
        if: runner.os != 'Windows'
      # Windows: keep the sandboxes on the workspace drive; upload-artifact
      # cannot collect files from another drive. Unix keeps /tmp.
      - run: npm run test:e2e
        working-directory: eval
        if: runner.os == 'Windows'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-sandboxes-${{ matrix.os }}
          path: |
            pi-famulus-test-artifacts/
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/eval-*/h/manager.log
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/eval-*/h/events.jsonl
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/eval-*/h/config.json
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/eval-*/faux-trace.jsonl
          if-no-files-found: ignore
