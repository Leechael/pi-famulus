name: Publish npm packages

on:
  # Select main as the workflow ref. The version is computed from the
  # channel: npm registry, git tags, and package.json, not typed by hand.
  workflow_dispatch:
    inputs:
      channel:
        description: Version bump (auto-detected from npm, git tags, and package.json)
        required: true
        type: choice
        options:
          - beta
          - nightly
          - patch
          - minor
          - major
      dry_run:
        description: Validate tarballs without publishing (does not test OIDC)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# Serialize publication, retaining up to 100 pending runs (not just the latest).
# GitHub cancels arrivals beyond that queue limit; retry them explicitly.
concurrency:
  group: npm-release
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      dry_run: ${{ steps.input.outputs.dry_run }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate event input before using it
        id: input
        env:
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          import { CHANNELS } from './scripts/next-release.mjs';
          assert.ok(CHANNELS.includes(process.env.CHANNEL), 'channel must be beta|nightly|patch|minor|major');
          assert.ok(['true', 'false'].includes(process.env.DRY_RUN));
          appendFileSync(process.env.GITHUB_OUTPUT, `channel=${process.env.CHANNEL}\ndry_run=${process.env.DRY_RUN}\n`);
          NODE
      - name: Compute the next version
        id: release
        env:
          CHANNEL: ${{ steps.input.outputs.channel }}
        run: node scripts/next-release.mjs --channel "$CHANNEL"
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Same full PR/main pipeline: manager real+manual clocks on four hosts,
  # extension tests, real pi e2e, tarball install smoke tests, all five packs.
  # `version` rewrites release metadata in the CI working tree so artifacts
  # match the computed version without committing to main.
  tests:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, tests]
    runs-on: ubuntu-24.04
    # npm trust must require this environment. Its external deployment policy
    # allows only the main branch, so editing a non-main workflow cannot bypass it.
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      DRY_RUN: ${{ needs.validate.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: |
          npm install --global npm@latest
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          assert.ok(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'npm >=11.5.1 is required');
          console.log(`Node ${process.version}, npm ${version}`);
          NODE
      - uses: actions/download-artifact@v5
        with:
          pattern: npm-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Apply computed version and revalidate before publication
        run: |
          node scripts/bump-release.mjs "$RELEASE_VERSION"
          node scripts/validate-release.mjs --tag "$RELEASE_TAG"
      - name: Check OIDC availability (never log tokens)
        if: needs.validate.outputs.dry_run == 'false'
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          echo 'OIDC request credentials are available; npm authenticates during publish.'
      - name: Validate artifacts and publish natives first, root last
        run: |
          mode=--dry-run
          if [[ "$DRY_RUN" == false ]]; then mode=--publish; fi
          node scripts/publish-packages.mjs "$RUNNER_TEMP/packages" "$RELEASE_TAG" "$mode"
      - name: Create GitHub tag and release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Retry idempotently with this run's validated RELEASE_TAG/SHA. If
          # npm has already published, a transient GitHub API error must not
          # force the next dispatch to compute a different version.
          api_url="${GITHUB_API_URL:-https://api.github.com}"
          api_url="${api_url%/}"
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          api_get() {
            local endpoint="$1" response_file="$2" status curl_status
            if status=$(curl --silent --show-error --stderr "$workdir/curl.err" \
              --retry 3 --retry-delay 2 --fail-with-body \
              --output "$response_file" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$api_url/$endpoint"); then
              printf '%s' "$status"
              return 0
            else
              curl_status=$?
            fi
            if [[ "$status" == 404 ]]; then
              printf '404'
              return 0
            fi
            if [[ -n "$status" ]]; then
              echo "GitHub API GET $endpoint failed with HTTP $status:" >&2
              cat "$response_file" >&2
            else
              echo "GitHub API GET $endpoint failed (curl exit $curl_status):" >&2
              cat "$workdir/curl.err" >&2
            fi
            return 1
          }

          # Resolve through the commits API so annotated tags peel to their
          # commit sha; git/ref/tags returns the tag-object sha for them.
          for attempt in 1 2 3 4 5; do
            tag_status=$(api_get "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" "$workdir/tag.json")
            case "$tag_status" in
              200)
                tag_sha=$(jq -er '.sha | strings' "$workdir/tag.json")
                if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
                  echo "Tag $RELEASE_TAG already exists at $tag_sha, expected $RELEASE_SHA" >&2
                  exit 1
                fi
                echo "Tag $RELEASE_TAG already points to $RELEASE_SHA"
                break
                ;;
              404)
                if (( attempt == 5 )); then
                  echo "Could not create or verify tag $RELEASE_TAG after retries" >&2
                  exit 1
                fi
                if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA"; then
                  echo "Tag creation attempt $attempt failed; checking again before retrying" >&2
                fi
                ;;
              *)
                echo "Unexpected tag lookup status: $tag_status" >&2
                exit 1
                ;;
            esac
            if [[ "$tag_status" != 200 && $attempt -lt 5 ]]; then sleep 2; fi
          done

          release_args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-beta.* || "$RELEASE_TAG" == *-nightly.* ]]; then
            release_args+=(--prerelease)
          fi
          for attempt in 1 2 3 4 5; do
            release_status=$(api_get "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" "$workdir/release.json")
            case "$release_status" in
              200)
                echo "GitHub Release $RELEASE_TAG already exists"
                break
                ;;
              404)
                if (( attempt == 5 )); then
                  echo "Could not create or verify GitHub Release $RELEASE_TAG after retries" >&2
                  exit 1
                fi
                if ! gh release create "$RELEASE_TAG" "${release_args[@]}"; then
                  echo "Release creation attempt $attempt failed; checking again before retrying" >&2
                fi
                ;;
              *)
                echo "Unexpected release lookup status: $release_status" >&2
                exit 1
                ;;
            esac
            if [[ "$release_status" != 200 && $attempt -lt 5 ]]; then sleep 2; fi
          done
