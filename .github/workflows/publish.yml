name: Publish npm packages

on:
  # Select main as the workflow ref. The version is computed from the
  # channel: npm registry, git tags, and package.json, not typed by hand.
  workflow_dispatch:
    inputs:
      channel:
        description: Version bump (auto-detected from npm, git tags, and package.json)
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - beta
          - nightly
      dry_run:
        description: Validate tarballs without publishing (does not test OIDC)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publication, retaining up to 100 pending runs (not just the latest).
# GitHub cancels arrivals beyond that queue limit; retry them explicitly.
concurrency:
  group: npm-release
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      dry_run: ${{ steps.input.outputs.dry_run }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate event input before using it
        id: input
        env:
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          import { CHANNELS } from './scripts/next-release.mjs';
          assert.ok(CHANNELS.includes(process.env.CHANNEL), 'channel must be beta|nightly|patch|minor|major');
          assert.ok(['true', 'false'].includes(process.env.DRY_RUN));
          appendFileSync(process.env.GITHUB_OUTPUT, `channel=${process.env.CHANNEL}\ndry_run=${process.env.DRY_RUN}\n`);
          NODE
      - name: Compute the next version
        id: release
        env:
          CHANNEL: ${{ steps.input.outputs.channel }}
        run: node scripts/next-release.mjs --channel "$CHANNEL"
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Same full PR/main pipeline: manager real+manual clocks on four hosts,
  # extension tests, real pi e2e, tarball install smoke tests, all five packs.
  # `version` rewrites release metadata in the CI working tree so artifacts
  # match the computed version without committing to main.
  tests:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, tests]
    runs-on: ubuntu-24.04
    # npm trust must require this environment. Its external deployment policy
    # allows only the main branch, so editing a non-main workflow cannot bypass it.
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      DRY_RUN: ${{ needs.validate.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: |
          npm install --global npm@latest
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          assert.ok(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'npm >=11.5.1 is required');
          console.log(`Node ${process.version}, npm ${version}`);
          NODE
      - uses: actions/download-artifact@v5
        with:
          pattern: npm-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Apply computed version and revalidate before publication
        run: |
          node scripts/bump-release.mjs "$RELEASE_VERSION"
          node scripts/validate-release.mjs --tag "$RELEASE_TAG"
      - name: Check OIDC availability (never log tokens)
        if: needs.validate.outputs.dry_run == 'false'
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          echo 'OIDC request credentials are available; npm authenticates during publish.'
      - name: Validate artifacts and publish natives first, root last
        run: |
          mode=--dry-run
          if [[ "$DRY_RUN" == false ]]; then mode=--publish; fi
          node scripts/publish-packages.mjs "$RUNNER_TEMP/packages" "$RELEASE_TAG" "$mode"
      - name: Create GitHub tag and release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs

  # Record a successful stable publish in source. The publish job already
  # created the tag and GitHub Release, so a failure here never affects the
  # published artifacts; re-run this job to retry. It edits only version
  # fields on the latest main (no rebase of the tagged commit), and the
  # script is a no-op if main already carries this or a newer version.
  # Pushes made with GITHUB_TOKEN do not start workflows: the release commit
  # touches only version fields that the release pipeline just tested.
  record-version:
    needs: [validate, publish]
    if: needs.validate.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # The default GITHUB_TOKEN is used only for the push below.
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Commit the release version to main
        # No `shell:` is set, so GitHub runs `bash -e {0}` (no pipefail).
        # The script's exit code must reach the step, so it is not piped
        # and pipefail is set explicitly.
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2; do
            # A failing script aborts the step here (set -e). Only a
            # successful "skip:" run leaves a clean tree.
            node scripts/writeback-release.mjs "$RELEASE_VERSION"
            if git diff --quiet; then
              echo "Nothing to commit: main already records v$RELEASE_VERSION or newer."
              exit 0
            fi
            node scripts/validate-release.mjs --tag "v$RELEASE_VERSION"
            git commit -a -m "chore(release): v$RELEASE_VERSION"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ $attempt == 2 ]]; then
              echo "::error::main moved twice while recording v$RELEASE_VERSION; re-run this job."
              exit 1
            fi
            # main moved: drop our commit and redo the version edit on the new tip.
            git fetch origin main
            git reset --hard origin/main
          done
