name: Native npm packages

on:
  # Allow building the npm packages standalone, without a full CI run.
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and test (empty uses the selected branch)
        type: string
        default: ''
      version:
        description: If set, rewrite release metadata to this version before packing
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and test (empty uses the caller's ref)
        type: string
        default: ''
      version:
        description: If set, rewrite release metadata to this version before packing
        type: string
        default: ''

permissions:
  contents: read

jobs:
  root-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply computed release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/bump-release.mjs "$RELEASE_VERSION"
      - run: node scripts/validate-release.mjs
      - run: node --test scripts/*.test.mjs
      - name: Pack root extension
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          npm pack --pack-destination "$RUNNER_TEMP/packages"
        working-directory: extension
      - uses: actions/upload-artifact@v5
        with:
          name: npm-root
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error

  native:
    name: native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      PI_FAMULUS_TEST_ARTIFACTS: ${{ github.workspace }}/pi-famulus-test-artifacts
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      # Avoid making the macOS runner's version the implicit runtime minimum.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Capture source commit for release build
        run: echo "PI_FAMULUS_GIT_SHA=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_ENV"
      - name: Release tooling tests on Windows
        if: runner.os == 'Windows'
        run: node --test scripts/*.test.mjs
      - name: Apply computed release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/bump-release.mjs "$RELEASE_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager
          key: ${{ matrix.target }}
      # musl-gcc links on the runner's own architecture; no cross linker needed.
      - name: Install native musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
      # Keep real-time timing canaries AND manually stepped daemon clock coverage.
      # tests/platform.rs is the portable lifecycle suite (named pipes, Job
      # Objects and the task shell on Windows); the sh-based suites are Unix-only.
      - run: cargo test --locked
        working-directory: manager
      - run: cargo test --locked --features test-clock
        working-directory: manager
      - name: Resource usage benchmark
        shell: bash
        env:
          PI_FAMULUS_BENCH: '1'
          PI_FAMULUS_BENCH_OUT: ${{ runner.temp }}/bench-${{ matrix.platform }}.json
        run: cargo test --locked --release --test resource_bench
        working-directory: manager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-bench-${{ matrix.platform }}
          path: ${{ runner.temp }}/bench-${{ matrix.platform }}.json
          if-no-files-found: ignore
      - name: Build release binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            export RUSTFLAGS='-C target-feature=+crt-static'
          fi
          cargo build --locked --release --target "$TARGET"
        working-directory: manager
      - name: Require a static Linux executable
        if: runner.os == 'Linux'
        run: |
          binary="manager/target/$TARGET/release/pi-famulus"
          file "$binary"
          if readelf -d "$binary" | grep -q '(NEEDED)'; then
            echo 'Release binary must not depend on a dynamic library' >&2
            exit 1
          fi
      - name: Reject an undeclared Windows VC runtime dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'Cannot locate dumpbin to inspect release dependencies' }
          $imports = & $dumpbin /dependents "manager/target/$env:TARGET/release/pi-famulus.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release dependencies' }
          $imports | Write-Output
          if ($imports -match '(?i)^\s*(vcruntime|msvcp|msvcr|concrt)[\w.]*\.dll\s*$') {
            throw 'Release binary must statically link the VC runtime'
          }
      - name: Prepare and pack actual native and root tarballs
        shell: bash
        run: |
          node scripts/prepare-native.mjs "$PLATFORM" "$RUNNER_TEMP/packages"
          npm pack ./extension --pack-destination "$RUNNER_TEMP/packages"
      - name: Install tarballs and verify automatic CLI and extension resolution
        shell: bash
        run: |
          sandbox=$(mktemp -d "$RUNNER_TEMP/npm-smoke.XXXXXX")
          export HOME="$sandbox/home" USERPROFILE="$sandbox/home"
          mkdir -p "$HOME" "$sandbox/project"
          unset PI_FAMULUS_MANAGER_PATH PI_FAMULUS_HOME
          cd "$sandbox/project"
          npm init -y
          # Paths via process.env: a Windows workspace path is not a valid JS string literal.
          version=$(node -p "require(require('path').join(process.env.GITHUB_WORKSPACE, 'extension/package.json')).version")
          # Use the same exact pi version as source tests, not the latest peer.
          pi_version=$(node -p "require(require('path').join(process.env.GITHUB_WORKSPACE, 'extension/package-lock.json')).packages['node_modules/@earendil-works/pi-coding-agent'].version")
          npm install --ignore-scripts --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@$pi_version" \
            "$RUNNER_TEMP/packages/pi-famulus-$version.tgz" \
            "$RUNNER_TEMP/packages/pi-famulus-$PLATFORM-$version.tgz"
          # No global manager or ~/.pi/agent/pi-famulus/bin: use the optional package.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { chmodSync, existsSync, mkdirSync, writeFileSync } from 'node:fs';
          const root = resolve('node_modules/pi-famulus');
          const { nativePackageName, resolveNativeManagerPath } = await import(pathToFileURL(`${root}/src/native-manager.js`));
          const name = nativePackageName(process.platform, process.arch);
          // Windows can only start a PE image whose name ends in .exe.
          const exe = process.platform === 'win32' ? 'pi-famulus.exe' : 'pi-famulus';
          const expected = resolve(`node_modules/${name}/bin/${exe}`);
          assert.equal(resolveNativeManagerPath(), expected);
          // jiti is pi's actual TypeScript loader: Node cannot strip TS in node_modules.
          const piRequire = createRequire(import.meta.resolve('@earendil-works/pi-coding-agent'));
          const { createJiti } = piRequire('jiti');
          const jiti = createJiti(import.meta.url);
          const { DEFAULT_CONFIG, resolveManagerPath } = await jiti.import(`${root}/src/config.ts`);
          const home = resolve(process.env.HOME, '.pi/agent/pi-famulus');
          const homeBinary = resolve(home, 'bin', exe);
          assert.equal(resolveManagerPath(DEFAULT_CONFIG, home, {}), expected);
          assert.equal(existsSync(homeBinary), false);
          assert.equal(resolveManagerPath({ ...DEFAULT_CONFIG, managerPath: process.execPath }, home, {}), process.execPath);
          assert.equal(resolveManagerPath(DEFAULT_CONFIG, home, { PI_FAMULUS_MANAGER_PATH: process.execPath }), process.execPath);
          mkdirSync(`${home}/bin`, { recursive: true });
          writeFileSync(homeBinary, '#!/bin/sh\nexit 0\n', { mode: 0o755 });
          assert.equal(resolveManagerPath(DEFAULT_CONFIG, home, {}), expected, 'package wins over old home installation');
          // Windows has no execute bit to take away.
          if (process.platform !== 'win32') {
            try {
              chmodSync(expected, 0o644);
              assert.equal(resolveManagerPath(DEFAULT_CONFIG, home, {}), homeBinary, 'unusable native permits manual fallback');
            } finally { chmodSync(expected, 0o755); }
          }
          NODE
          ./node_modules/.bin/pi-famulus --help
          ./node_modules/.bin/pi-famulus --version | grep -F "pi-famulus $version"
          # Exercise the actual packaged daemon/runner (including musl), not just --help.
          manager_home=$(mktemp -d "$RUNNER_TEMP/native-XXXXXX")
          trap './node_modules/.bin/pi-famulus --home "$manager_home" shutdown || true' EXIT
          line=$(./node_modules/.bin/pi-famulus --home "$manager_home" start 'printf native-package-roundtrip')
          id=${line#task_id=}; id=${id%% *}
          ./node_modules/.bin/pi-famulus --home "$manager_home" wait "$id" --budget-ms 10000
          ./node_modules/.bin/pi-famulus --home "$manager_home" output "$id" | grep -F native-package-roundtrip
          ./node_modules/.bin/pi-famulus --home "$manager_home" status --json
          ./node_modules/.bin/pi-famulus --home "$manager_home" shutdown
      - uses: actions/upload-artifact@v5
        with:
          name: npm-${{ matrix.platform }}
          path: ${{ runner.temp }}/packages/pi-famulus-${{ matrix.platform }}-*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: manager-logs-${{ matrix.platform }}
          path: pi-famulus-test-artifacts
          if-no-files-found: ignore
