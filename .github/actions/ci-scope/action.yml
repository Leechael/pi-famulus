name: CI scope
description: Classify changed paths so CI runs only the check families they can affect, retaining README checks
# Caller must check out the repository first and grant pull-requests: read.
inputs:
  force:
    description: Set to 'true' to require code checks regardless of changed paths
    required: false
    default: 'false'
# Every output is 'true' for forced and non-diff events. Otherwise a change
# outside manager/, extension/ and eval/ (workflows, scripts, npm packaging,
# root files) is shared infrastructure and selects every family: fail closed.
outputs:
  code:
    description: Whether any code checks must run ('true' or 'false')
    value: ${{ (inputs.force == 'true' || (github.event_name != 'push' && github.event_name != 'pull_request')) && 'true' || steps.changes.outputs.code }}
  rust:
    description: Whether the Rust manager changed ('true' or 'false')
    value: ${{ (inputs.force == 'true' || (github.event_name != 'push' && github.event_name != 'pull_request')) && 'true' || ((steps.changes.outputs.code == 'true' && (steps.areas.outputs.rust == 'true' || steps.changes.outputs.shared == 'true')) && 'true' || 'false') }}
  extension:
    description: Whether the pi extension changed ('true' or 'false')
    value: ${{ (inputs.force == 'true' || (github.event_name != 'push' && github.event_name != 'pull_request')) && 'true' || ((steps.changes.outputs.code == 'true' && (steps.areas.outputs.extension == 'true' || steps.changes.outputs.shared == 'true')) && 'true' || 'false') }}
  eval:
    description: Whether the eval harness changed ('true' or 'false')
    value: ${{ (inputs.force == 'true' || (github.event_name != 'push' && github.event_name != 'pull_request')) && 'true' || ((steps.changes.outputs.code == 'true' && (steps.areas.outputs.eval == 'true' || steps.changes.outputs.shared == 'true')) && 'true' || 'false') }}
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
      id: changes
      if: ${{ inputs.force != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
      with:
        # PRs use the API's full PR diff, not just the latest commit. Pushes
        # compare the entire pushed range, including multi-commit pushes.
        base: ${{ github.event_name == 'push' && github.event.before || '' }}
        predicate-quantifier: every
        filters: |
          code:
            - '!README.md'
            - '!README_CN.md'
            - '!docs/**'
            - '!extension/README.md'
            - '!npm/**/README.md'
            - '!npm/CONTEXT.md'
            - '!manager/TESTING.md'
            - '!manager/MONITOR_OUTPUT.md'
            - '!eval/*.md'
            - '!eval/ablation/fixtures/README.md'
          # Any code path outside the three component trees.
          shared:
            - '!manager/**'
            - '!extension/**'
            - '!eval/**'
            - '!README.md'
            - '!README_CN.md'
            - '!docs/**'
            - '!npm/**/README.md'
            - '!npm/CONTEXT.md'
    - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
      id: areas
      if: ${{ inputs.force != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
      with:
        base: ${{ github.event_name == 'push' && github.event.before || '' }}
        filters: |
          rust:
            - 'manager/**'
          extension:
            - 'extension/**'
          eval:
            - 'eval/**'
    - name: Check README synchronization and links on docs-only changes
      if: ${{ steps.changes.outputs.code == 'false' }}
      shell: bash
      run: node --test scripts/readme-sync.test.mjs
