[package]
name = "pi-famulus-gui"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
description = "Spike: a native desktop view of pi-famulus tasks and agents, on NSH."
license = "MIT"
publish = false

# Its own workspace: the GUI is not part of the manager's build, lockfile or
# npm packages, so NSH and its platform crates never reach the daemon binary.
[workspace]

[dependencies]
pi-famulus = { path = "../manager" }
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
# The TUI's view types, at the versions the manager uses.
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }
# The tray icon: NSH 0.4 has no status item, so `src/tray.rs` uses AppKit.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSString", "NSGeometry", "NSArray", "NSNotification", "NSObject", "block2"] }
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSWindow", "NSView", "NSControl", "NSButton", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSImage", "block2"] }
dispatch2 = "0.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
